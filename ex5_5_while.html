<html>

<body>
    <script>
        let number = Number(prompt("Enter the number: "));
        let result = "";
        let row = 0;

        while (row < number) {
            let col = 0;

            while (col < row) {
                result += "  ";
                col++;
            }

            col = 0;
            while (col < number - row) {
                result += "* ";
                col++;
            }

            result += "\n";
            row++;
        }

        alert(result);
    </script>
</body>

</html>
