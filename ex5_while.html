<html>
<body>
    <script>
        let number = Number(prompt("Enter the number: "));
        let result = "";

        let row = 0;
        while (row < number) {
            let col = 0;
            while (col < number) {
                result += "* ";
                col++;
            }
            result += "\n"; // переход на новую строку
            row++;
        }

        alert(result); 
        // или можно сразу в документ вывести:
        document.write("<pre>" + result + "</pre>");
    </script>
</body>
</html>
