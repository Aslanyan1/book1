<html>

<body>
    <script>
        let num = Number(prompt("Enter the number"));
        let reversed = 0;
        let or_num = num

        while (num > 0) {
            reversed = reversed * 10 + (num % 10);
            num = Math.floor(num / 10);
        }
        if (or_num === reversed){
            alert(true)
        }
        else{
            alert(false)
        }
    </script>
</body>

</html>
