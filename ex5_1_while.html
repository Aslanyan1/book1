<html>
<body>
    <script>
        let number = Number(prompt("Enter the number: "));
        let result = "";

        let row = 0;
        while (row < number) {
            let col = 0;
            while (col < number) {
                if (row === 0 || row === number - 1 || col === 0 || col === number - 1) {
                    result += "* ";
                } else {
                    result += "  ";
                }
                col++;
            }
            result += "\n";
            row++;
        }
        alert(result);
    </script>
</body>
</html>
