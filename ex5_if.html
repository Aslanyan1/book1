<html>

<body>
    <script>
        let num = prompt("Enter the number")
        if (num <= 100) {
            alert(0)
        }
        else if (100 < num <= 200) {
            alert((num - 100) * 200)
        }
        else if (num > 200) {
            alert(100 * 200 + (num - 200) * 220)
        }
    </script>
</body>

</html>
